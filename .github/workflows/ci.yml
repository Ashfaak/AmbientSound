name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12 and sync dependencies
        run: uv sync --python 3.12 --all-groups
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Run test suite
        run: uv run pytest -v
      - name: Run repository hygiene check
        run: uv run python scripts/check_hygiene.py
